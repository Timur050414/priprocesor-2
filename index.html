<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div class="dashboard">
        <header class="header">
            <div class="header__logo">Dashboard</div>
            <div class="notifications">
                <span class="notifications__badge">3</span>
            </div>
        </header>

        <aside class="sidebar">
            <nav class="sidebar__nav">
                <a href="#" class="sidebar__link">Головна</a>
                <a href="#" class="sidebar__link">Завдання</a>
            </nav>
        </aside>

        <main class="dashboard__content">
            <section class="stats">
                <div class="stats__card">Статистика 1</div>
                <div class="stats__card">Статистика 2</div>
            </section>

            <section class="tasks">
                <div class="tasks__item">Завдання 1</div>
                <div class="tasks__item">Завдання 2</div>
            </section>

            <section class="activity">
                <table class="activity__table">
                    <thead>
                        <tr>
                            <th>Дія</th>
                            <th>Час</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Вхід у систему</td>
                            <td>10:00</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <div class="u-full-width u-text-center">
                <button class="btn btn--primary">Основна кнопка</button>
                <button class="btn btn--secondary">Вторинна кнопка</button>
            </div>
        </main>

        <div class="modal">
            <div class="modal__content">
                <h2>Модальне вікно</h2>
                <p class="u-visually-hidden">Прихований текст для скрінрідерів</p>
            </div>
        </div>
    </div>
</body>

</html>
